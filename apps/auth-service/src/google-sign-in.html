<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Google OAuth Test</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f5f5f5;
    }

    .container{
      background:white;
      padding:40px;
      border-radius:12px;
      text-align:center;
      box-shadow:0 4px 15px rgba(0,0,0,.1);
      width:350px;
    }

    h2{
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      background:#fff;
      border:1px solid #ddd;
    }

    button:hover{
      background:#f2f2f2;
    }

    img{
      width:20px;
    }

    .result{
      margin-top:20px;
      font-size:14px;
      color:green;
      word-break:break-word;
    }
  </style>
</head>
<body>

<div class="container">

    <h2>Google OAuth Test</h2>

    <button id="googleBtn">

        <img
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        />

        Continue with Google

    </button>

    <div
      class="result"
      id="result">
    </div>

</div>

<script>

const API_URL =
"http://localhost:3001/api/v1/auth/google";


document
.getElementById(
"googleBtn"
)

.addEventListener(
"click",
()=>{

window.location.href=
API_URL

})

</script>

</body>
</html>
