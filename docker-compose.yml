
services:

  postgres:
    image: postgres:alpine  # Matched to your local cache to prevent heavy downloads
    container_name: dewaju-mart-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine  # Matches your local Docker Desktop cache perfectly
    container_name: dewaju-mart-redis
    ports:
      - "6379:6379"      # Exposes Redis on the standard default port
    volumes:
      - redis_data:/data # Persists your cache/OTP data if the container restarts
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest  # Forced to check local 'latest' cache tag
    container_name: dewaju-mart-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0  # Matches your local 7.5.0 image exactly
    container_name: dewaju-mart-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0  # Matches your local 7.5.0 image exactly
    container_name: dewaju-mart-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network: